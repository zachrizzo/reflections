; PROPOSED, NOT LIVE. The perf session wrote this file (ArtDirection/Perf/README.md, "Scalability").
; To use it: copy it to Config/DefaultScalability.ini after one A/B pass on the final package, with the orchestrator's OK.
; It layers on top of the engine's BaseScalability.ini; only the keys below change.
; Goal: the presets also scale per-character cost, the real limit in this game (about 0.43 ms of game thread
; per MetaHuman), and hardware ray tracing stays an Epic feature.

[ViewDistanceQuality@0]
r.SkeletalMeshLODBias=2

[ViewDistanceQuality@1]
r.SkeletalMeshLODBias=1

[ViewDistanceQuality@2]
r.SkeletalMeshLODBias=0

[ViewDistanceQuality@3]
r.SkeletalMeshLODBias=0

; Software Lumen below Epic. Skinned meshes stay out of the ray-tracing scene (saves the BLAS refits and the render-thread gather).
[GlobalIlluminationQuality@1]
r.Lumen.HardwareRayTracing=0
r.RayTracing.Geometry.SkeletalMeshes=0

[GlobalIlluminationQuality@2]
r.Lumen.HardwareRayTracing=0
r.RayTracing.Geometry.SkeletalMeshes=0

[GlobalIlluminationQuality@3]
r.Lumen.HardwareRayTracing=1
r.RayTracing.Geometry.SkeletalMeshes=1
