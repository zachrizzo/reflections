name: Stronghold entrance source review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/stronghold-entrance-review.yml]

permissions:
  contents: read

jobs:
  review:
    if: ${{ github.repository == 'zachrizzo/reflections' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out only stronghold review sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
          lfs: true
          submodules: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitattributes
            /.github/workflows/stronghold-entrance-review.yml
            /Tools/CityPCG/stronghold_entrance_review_common.py
            /Tools/CityPCG/stronghold_entrance_review_hosted.py
            /Tools/CityPCG/test_stronghold_entrance_review.py
            /ArtDirection/MedievalLondon/MarketDressing/build_watch_gate.py
            /ArtDirection/MedievalLondon/MarketDressing/build_market_dressing.py
            /ArtDirection/CityPCG/MedievalOpening/StrongholdKit/placement_recipe.json
            /ArtDirection/CityPCG/MedievalOpening/StrongholdKit/Source/SM_GL1450_WatchGate.glb
            /ArtDirection/CityPCG/MedievalOpening/StrongholdKit/Source/SM_GL1450_StrongholdGateFrame.glb
            /ArtDirection/CityPCG/MedievalOpening/StrongholdKit/Source/SM_GL1450_StrongholdPennantsOccupied.glb
            /ArtDirection/CityPCG/MedievalOpening/StrongholdKit/Source/SM_GL1450_StrongholdPennantsReclaimed.glb

      - name: Validate hosted context and pinned inputs
        run: |
          python3 -B -c "import sys; sys.path.insert(0,'Tools/CityPCG'); import stronghold_entrance_review_common as c; c.validate_inputs(c.hosted_context())"
          python3 -B Tools/CityPCG/test_stronghold_entrance_review.py -v
          python3 -O -B Tools/CityPCG/test_stronghold_entrance_review.py -v

      - name: Fetch pinned official Blender
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/blender-4.5.3-linux-x64.tar.xz"
          timeout --signal=TERM --kill-after=10s 420s curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --retry 2 --retry-all-errors --retry-delay 5 \
            --retry-max-time 400 --max-redirs 3 --connect-timeout 15 --max-time 360 --max-filesize 400000000 \
            https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz --output "$archive"
          printf '%s  %s\n' '975c58fcb244273838534bba771e64ad87739216b0f9b39a888531a49a72d845' "$archive" | sha256sum --check --strict
          tar -xJf "$archive" -C "$RUNNER_TEMP"

      - name: Build and independently reimport review assets
        shell: bash
        run: |
          set -euo pipefail
          blender="$RUNNER_TEMP/blender-4.5.3-linux-x64/blender"
          script="$GITHUB_WORKSPACE/Tools/CityPCG/stronghold_entrance_review_hosted.py"
          timeout --signal=TERM --kill-after=10s 600s "$blender" --background --threads 2 \
            --factory-startup --python-exit-code 1 --python "$script" -- build
          timeout --signal=TERM --kill-after=10s 180s "$blender" --background --threads 2 \
            --factory-startup --python-exit-code 1 --python "$script" -- verify
          python3 -B - <<'STRONGHOLD_PY'
          import hashlib, json, struct
          from pathlib import Path
          out=Path('ci-stronghold-entrance-review')
          built=json.loads((out/'build.report.json').read_text(encoding='utf-8'))
          verified=json.loads((out/'verify.report.json').read_text(encoding='utf-8'))
          names=('01_gate_only.png','02_occupied_dressed.png','03_reclaimed_dressed.png')
          if (built.get('status')!='illustrative_source_review_not_in_game'
                  or verified.get('status')!='review_only_clean_glb_reimport'
                  or set(built.get('preview_sha256',{}))!=set(names)):
              raise SystemExit('Incomplete stronghold review')
          for name in names:
              path=out/name
              if path.is_symlink() or not path.is_file(): raise SystemExit('Missing preview')
              data=path.read_bytes()
              if (len(data)<24 or data[:8]!=b'\x89PNG\r\n\x1a\n' or data[12:16]!=b'IHDR'
                      or struct.unpack('>II',data[16:24])!=(960,540)
                      or hashlib.sha256(data).hexdigest()!=built['preview_sha256'][name]):
                  raise SystemExit('Invalid stronghold review image')
          STRONGHOLD_PY

      - name: Upload illustrative stronghold review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stronghold-entrance-illustrative-review
          path: ci-stronghold-entrance-review/
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: false
