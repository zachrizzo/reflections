name: Preserve North Market street review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/preserve-north-market-street-review.yml]

permissions:
  actions: read
  contents: write

concurrency:
  group: preserve-north-market-street-review
  cancel-in-progress: false

jobs:
  preserve:
    if: ${{ github.repository == 'zachrizzo/reflections' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out only preservation inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
          lfs: false
          submodules: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitattributes
            /.github/workflows/preserve-north-market-street-review.yml
            /Tools/CityPCG/preserve_north_market_hosted.py
            /Tools/CityPCG/preserve_north_market_street_review.py
            /Tools/CityPCG/test_preserve_north_market_street_review.py
            /ArtDirection/CityPCG/MedievalOpening/WholeBuildings/NorthMarketDetailedObj/.gitattributes
            /ArtDirection/CityPCG/MedievalOpening/WholeBuildings/NorthMarketDetailedObj/HostedStreetReview/README.md
            /ArtDirection/CityPCG/MedievalOpening/WholeBuildings/NorthMarketDetailedObj/HostedStreetReview/

      - name: Test preservation guards
        run: |
          python3 -B Tools/CityPCG/test_preserve_north_market_street_review.py -v
          python3 -O -B Tools/CityPCG/test_preserve_north_market_street_review.py -v

      - name: Preserve checked review archive and images
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B Tools/CityPCG/preserve_north_market_street_review.py
