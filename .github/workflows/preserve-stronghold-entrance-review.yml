name: Preserve illustrative stronghold entrance review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/preserve-stronghold-entrance-review.yml]

permissions:
  actions: read
  contents: write

concurrency:
  group: preserve-stronghold-entrance-review
  cancel-in-progress: false

jobs:
  preserve:
    if: ${{ github.repository == 'zachrizzo/reflections' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out only preservation inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
          lfs: false
          submodules: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitattributes
            /.github/workflows/preserve-stronghold-entrance-review.yml
            /Tools/CityPCG/preserve_north_market_hosted.py
            /Tools/CityPCG/test_preserve_north_market_hosted.py
            /Tools/CityPCG/preserve_north_market_tenancy_fbx.py
            /Tools/CityPCG/preserve_stronghold_entrance_review.py
            /Tools/CityPCG/test_preserve_stronghold_entrance_review.py
            /ArtDirection/CityPCG/MedievalOpening/StrongholdKit/HostedEntranceReview/

      - name: Test preservation guards
        run: |
          python3 -B Tools/CityPCG/test_preserve_north_market_hosted.py -v
          python3 -O -B Tools/CityPCG/test_preserve_north_market_hosted.py -v
          python3 -B Tools/CityPCG/test_preserve_stronghold_entrance_review.py -v
          python3 -O -B Tools/CityPCG/test_preserve_stronghold_entrance_review.py -v

      - name: Preserve review after remote LFS readback
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B Tools/CityPCG/preserve_stronghold_entrance_review.py
