name: Merchant Gate hosted source

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/merchant-gate-hosted-source.yml

permissions:
  contents: read

jobs:
  export-source:
    if: ${{ github.repository == 'zachrizzo/reflections' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out only gate inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
          lfs: false
          submodules: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/merchant-gate-hosted-source.yml
            /Tools/CityPCG/export_merchant_gate_hosted.py
            /Tools/CityPCG/test_export_merchant_gate_hosted.py
            /Tools/CityPCG/qa_merchant_gate_hosted.py
            /Tools/CityPCG/test_qa_merchant_gate_hosted.py
            /Tools/CityPCG/build_merchant_gate_procedural.py
            /Tools/CityPCG/test_build_merchant_gate_procedural.py
            /Tools/CityPCG/audit_merchant_gate.py
            /Tools/CityPCG/extract_tile_frontages.py
            /ArtDirection/CityPCG/MedievalOpening/MarketDressingKit/build_market_dressing.py
            /ArtDirection/CityPCG/MedievalOpening/Landmarks/MerchantGate/References/merchant_gate_imagegen_v1.png
            /ArtDirection/CityPCG/MedievalOpening/Textures/T_GLMedieval_Fieldstone.png
            /ArtDirection/CityPCG/MedievalOpening/Textures/T_GLMedieval_WarmPlaster.png
            /ArtDirection/CityPCG/MedievalOpening/Textures/T_GLMedieval_Oak.png
            /ArtDirection/CityPCG/MedievalOpening/Textures/T_GLMedieval_WeatheredOak.png
            /ArtDirection/CityPCG/MedievalOpening/Textures/T_GLMedieval_ClayTile.png

      - name: Require a workflow-only single-commit push
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          python3 -B - <<'PY'
          import json
          import os
          import re
          import subprocess

          with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as source:
              event = json.load(source)
          before = event.get('before')
          after = event.get('after')
          expected = os.environ['GITHUB_SHA']
          if (event.get('ref') != 'refs/heads/main' or event.get('deleted') is not False
                  or event.get('forced') is not False or not isinstance(before, str)
                  or not re.fullmatch(r'[0-9a-f]{40}', before) or before == '0' * 40
                  or after != expected or not re.fullmatch(r'[0-9a-f]{40}', expected)):
              raise SystemExit('Refusing an unexpected push event')
          parents = subprocess.check_output(
              ['git', 'rev-list', '--parents', '-n', '1', expected], text=True
          ).split()
          if parents != [expected, before]:
              raise SystemExit('Push must contain exactly one non-merge commit')
          changed = subprocess.check_output(
              ['git', 'diff', '--no-ext-diff', '--no-renames', '--name-only', '-z', before, expected]
          ).split(b'\0')
          if changed != [b'.github/workflows/merchant-gate-hosted-source.yml', b'']:
              raise SystemExit('Push may change only this workflow file')
          PY

      - name: Check gate geometry and hosted-only guard
        run: |
          python3 -B Tools/CityPCG/test_build_merchant_gate_procedural.py -v
          python3 -B Tools/CityPCG/test_export_merchant_gate_hosted.py -v
          python3 -B Tools/CityPCG/test_qa_merchant_gate_hosted.py -v

      - name: Export review-only gate source
        run: python3 -B Tools/CityPCG/export_merchant_gate_hosted.py

      - name: Independently review source and render flat-color previews
        run: python3 -B Tools/CityPCG/qa_merchant_gate_hosted.py

      - name: Upload gate source for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: merchant-gate-source
          path: ci-merchant-gate-source/
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false

      - name: Upload independent gate review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: merchant-gate-source-qa
          path: ci-merchant-gate-qa/
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false
