name: Occupied street compound source review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/compound-street-review.yml]

permissions:
  contents: read

jobs:
  review:
    if: ${{ github.repository == 'zachrizzo/reflections' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out only pinned review sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
          lfs: true
          submodules: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitattributes
            /.github/workflows/compound-street-review.yml
            /Tools/CityPCG/compound_review_common.py
            /Tools/CityPCG/compound_street_review_hosted.py
            /Tools/CityPCG/test_compound_street_review.py
            /Tools/CityPCG/stronghold_entrance_review_common.py
            /Tools/CityPCG/stronghold_entrance_review_hosted.py
            /ArtDirection/CityPCG/MedievalOpening/WholeBuildings/NorthMarketDetailedObj/HostedStreetReview/north-market-street-illustrative-review.zip
            /ArtDirection/CityPCG/MedievalOpening/StrongholdKit/HostedEntranceReview/stronghold_entrance_illustrative_review.zip

      - name: Validate hosted context and source pins
        run: |
          python3 -B -c "import sys; sys.path.insert(0,'Tools/CityPCG'); import compound_review_common as c; c.validate_inputs(c.hosted_context()[0])"
          python3 -B Tools/CityPCG/test_compound_street_review.py -v
          python3 -O -B Tools/CityPCG/test_compound_street_review.py -v

      - name: Fetch pinned official Blender with bounded fallback
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/blender-4.5.3-linux-x64.tar.xz"
          download() {
            timeout --signal=TERM --kill-after=10s 240s curl --fail --silent --show-error --location \
              --proto '=https' --proto-redir '=https' --retry 2 --retry-all-errors --retry-delay 5 \
              --retry-max-time 220 --max-redirs 3 --connect-timeout 15 --max-time 200 --max-filesize 400000000 \
              "$1" --output "$archive"
          }
          if ! download 'https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz'; then
            download 'https://mirror.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz'
          fi
          printf '%s  %s\n' '975c58fcb244273838534bba771e64ad87739216b0f9b39a888531a49a72d845' "$archive" | sha256sum --check --strict
          tar -xJf "$archive" -C "$RUNNER_TEMP"

      - name: Build and independently reimport compound scenes
        shell: bash
        run: |
          set -euo pipefail
          blender="$RUNNER_TEMP/blender-4.5.3-linux-x64/blender"
          script="$GITHUB_WORKSPACE/Tools/CityPCG/compound_street_review_hosted.py"
          timeout --signal=TERM --kill-after=10s 600s "$blender" --background --threads 2 \
            --factory-startup --python-exit-code 1 --python "$script" -- build
          timeout --signal=TERM --kill-after=10s 240s "$blender" --background --threads 2 \
            --factory-startup --python-exit-code 1 --python "$script" -- verify
          python3 -B - <<'COMPOUND_PY'
          import hashlib, json, struct
          from pathlib import Path
          out=Path('ci-compound-street-review')
          built=json.loads((out/'build.report.json').read_text(encoding='utf-8'))
          verified=json.loads((out/'verify.report.json').read_text(encoding='utf-8'))
          names=('01_existing_gate_in_street.png','02_occupied_compound.png',
                 '03_reclaimed_compound.png','04_occupied_reverse.png')
          if (built.get('status')!='illustrative_source_review_not_in_game'
                  or verified.get('status')!='review_only_clean_glb_reimport'
                  or set(built.get('preview_sha256',{}))!=set(names)):
              raise SystemExit('Incomplete compound review')
          for name in names:
              path=out/name
              if path.is_symlink() or not path.is_file(): raise SystemExit('Missing preview')
              data=path.read_bytes()
              if (len(data)<24 or data[:8]!=b'\x89PNG\r\n\x1a\n' or data[12:16]!=b'IHDR'
                      or struct.unpack('>II',data[16:24])!=(960,540)
                      or hashlib.sha256(data).hexdigest()!=built['preview_sha256'][name]):
                  raise SystemExit('Invalid preview')
          COMPOUND_PY

      - name: Upload illustrative compound review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compound-street-illustrative-review
          path: ci-compound-street-review/
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: false
