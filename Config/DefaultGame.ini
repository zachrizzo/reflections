[/Script/UnrealEd.ProjectPackagingSettings]
+DirectoriesToAlwaysCook=(Path="/Game/Characters/CrowdMotion")
; --- Jam packaging (see ArtDirection/Packaging/README.md) ---
; Cook only the start map and what it references, instead of every map in Content.
+MapsToCook=(FilePath="/Game/GrayLondon/Maps/MedievalLondon")
; New Game opens Jah's Gray London map, the source of truth for the world (user, 2026-11-14 21:00).
; Loaded by C++ through string paths at runtime, so the cooker cannot discover them from the map.
+DirectoriesToAlwaysCook=(Path="/Game/Characters/Hero/Gameplay")
+DirectoriesToAlwaysCook=(Path="/Game/Characters/Hero/Animation/CombatCasts")
+DirectoriesToAlwaysCook=(Path="/Game/Characters/Hero/SpellVFX")
+DirectoriesToAlwaysCook=(Path="/Game/Input")
+DirectoriesToAlwaysCook=(Path="/Game/Blueprints/Combat/Blood")
+DirectoriesToAlwaysCook=(Path="/Game/Characters/WhiteLondon/IvenRook/MetaHuman/Animation/ElementalSpells/FX")
; Jam audio (cues, waves, classes, mixes); requested by the audio owner, cues may be loaded by soft path.
+DirectoriesToAlwaysCook=(Path="/Game/Audio/Jam")
; Spell crafting (VFX, gesture clips) and world jump (config, input, materials): loaded by string path. Requested by their owners.
+DirectoriesToAlwaysCook=(Path="/Game/SpellCrafting")
+DirectoriesToAlwaysCook=(Path="/Game/Worlds")
; Villain, possession and finale: loaded by string path (materials, FX, robe mesh, DA_VillainConfig). Requested by its owner.
+DirectoriesToAlwaysCook=(Path="/Game/Villain")
; Game flow (title, pause, Tarnish meter): String Table ST_GameFlowText loaded by string path. Requested by its owner.
+DirectoriesToAlwaysCook=(Path="/Game/UI")
; NPC archetypes (NPC unify session; folder created after train #3). Loaded by string path.
+DirectoriesToAlwaysCook=(Path="/Game/NPC/Archetypes")
; Squads: Kimodo march cycles per soldier skeleton, loaded by string path (4.3 MB on disk incl. the 2.4 MB source sequence).
+DirectoriesToAlwaysCook=(Path="/Game/Squads")
; Crowd city level, loaded at runtime by name via the Crowd.Mass.Level cvar (/Game/Crowd/City/Lvl_HeroSampleCrowd_City).
; Levels loaded by name are never discovered by the cook. The folder doesn't exist yet, which is harmless.
+DirectoriesToAlwaysCook=(Path="/Game/Crowd/City")
; Quest system (DA_QuestPack_Story) and cutscenes (/Game/Cinematics/Data/DA_Cutscene_<Name>): loaded by path at runtime.
; Neither folder exists yet, which is harmless. Requested by the orchestrator.
+DirectoriesToAlwaysCook=(Path="/Game/Quests")
+DirectoriesToAlwaysCook=(Path="/Game/Cinematics")
; NPC lives (DA_PeopleBook, loaded by path; created after train #7). Requested via the orchestrator for npc-lives.
+DirectoriesToAlwaysCook=(Path="/Game/Lives")
; Kimodo melee set (30 AS_Melee_* clips; idle/block/hit/death/wand are loaded by path). Requested by spell crafting.
+DirectoriesToAlwaysCook=(Path="/Game/Combat/Melee")
; Placeholder test maps and authoring-only clips/rigs that their owners confirmed are not used at runtime; nothing cooked references them.
+DirectoriesToNeverCook=(Path="/Game/Worlds/Test")
+DirectoriesToNeverCook=(Path="/Game/Characters/Hero/Animation/CombatCasts/Rigs")
+DirectoriesToNeverCook=(Path="/Game/Characters/Hero/Animation/CombatCasts/Soma")
; Melee authoring provenance (Kimodo LevelSequence + trimmed copies); its owner says editor-only, and nothing references it.
+DirectoriesToNeverCook=(Path="/Game/Combat/Melee/Source")
; Advanced Locomotion System V4 sample content: only referenced by the old /Game/Blueprints/Data/Weapons/WD_* data, which is never cooked.
+DirectoriesToNeverCook=(Path="/Game/AdvancedLocomotionV4")
; Guards (approved by the orchestrator): Epic sample characters (~1.9 GB source) referenced only by GASP's uncooked
; visual-override retarget set (/Game/Blueprints/RetargetedCharacters). A future reference fails the cook loudly.
+DirectoriesToNeverCook=(Path="/Game/Characters/Paragon")
+DirectoriesToNeverCook=(Path="/Game/Characters/Echo")
+DirectoriesToNeverCook=(Path="/Game/Characters/UE4_Mannequin")
; The map's pawn and controller (also string-loaded) are listed in Config/DefaultEditor.ini [AlwaysCookMaps].
; Engine-plugin face-tracking model data (MetaHuman Animator / Live Link) that the game never uses (~580 MB cooked).
; /NNEDenoiser (~100 MB) is NOT listed here (never-cooking a plugin's root path trips an AssetReferenceRestrictions ensure);
; it is excluded from the Game target in reflections.uproject ("TargetAllowList": ["Editor"]) instead.
+DirectoriesToNeverCook=(Path="/MetaHuman/GenericTracker")
+DirectoriesToNeverCook=(Path="/MetaHumanCoreTech/GenericTracker")
