[UnrealEd.SimpleMap]
SimpleMapName=/Game/ThirdPersonCPP/Maps/ThirdPersonExampleMap

[EditoronlyBP]
bAllowClassAndBlueprintPinMatching=true
bReplaceBlueprintWithClass= true
bDontLoadBlueprintOutsideEditor= true
bBlueprintIsNotBlueprintType= true

[/Script/UAFAnimNodeEditor.UAFSynchronizationModifier]
StoredNativeRevision=1

; Jam packaging (see ArtDirection/Packaging/README.md): packages the cooker must always include.
; Despite the section name, any package works. ReflectionsSampleGameMode::InitGame loads these two by
; string path, so nothing in the map references them. Their folder (Hero/Sample) cannot be always-cooked
; as a whole: GM_HeroSample there pulls in the broken /Script/action_fighting Blueprints.
[AlwaysCookMaps]
+Map=/Game/Characters/Hero/Sample/BP_HeroSampleCleanTest
+Map=/Game/Characters/Hero/Sample/BP_SampleControllerClean
; Villain session's C++ string-loads these Mannequin assets until its DA_VillainConfig exists (it will hard-reference them).
; The whole Mannequins folder is 126 MB on disk, so only these packages are listed.
+Map=/Game/Characters/Mannequins/Anims/Unarmed/MM_Idle
+Map=/Game/Characters/Mannequins/Anims/Unarmed/Jump/MM_Fall_Loop
+Map=/Game/Characters/Mannequins/Anims/Unarmed/Jump/MM_Dash
+Map=/Game/Characters/Mannequins/Anims/Unarmed/Attack/MM_Attack_02
+Map=/Game/Characters/Mannequins/Anims/Unarmed/Attack/MM_Attack_03
+Map=/Game/Characters/Mannequins/Anims/Unarmed/Attack/MM_ChargedAttack
+Map=/Game/Characters/Mannequins/Meshes/SKM_Manny_Simple
+Map=/Game/Characters/Mannequins/Meshes/SKM_Quinn_Simple
; Soldier and NPC weapons, string-loaded by Squads (ReflectionsSquad.cpp) and the NPC archetype defaults.
+Map=/Game/LanthorneAssets/Frostside/Props/SM_Frostside_MirrorSword
+Map=/Game/LanthorneAssets/Pewterside/Props/SM_Pewterside_ReaderWand
+Map=/Game/Characters/Mannequins/Anims/Unarmed/ABP_Unarmed
; Squads spawn these White London looks by string path. Their folder also holds a QA level sequence, so only the looks are listed.
+Map=/Game/Characters/WhiteLondon/CrowdPreview/BP_WhiteLook_03_Mantle
+Map=/Game/Characters/WhiteLondon/CrowdPreview/BP_WhiteLook_04_CapMantle
+Map=/Game/Characters/WhiteLondon/CrowdPreview/BP_WhiteLook_05_GuardRags
+Map=/Game/Characters/WhiteLondon/CrowdPreview/BP_WhiteLook_06_GuardBoldRunes

