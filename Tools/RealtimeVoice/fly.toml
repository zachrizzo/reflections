# Fly.io config for the hosted NPC dialogue relay. NOT DEPLOYED: needs the user's approval.
# Deploy (after approval):  fly launch --no-deploy --copy-config ; fly volumes create npc_data --size 1
#   fly secrets set GEMINI_API_KEY=... REFLECTIONS_CLIENT_KEYS=... ; fly deploy
app = "reflections-npc-dialogue"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  REFLECTIONS_NPC_DATA_DIR = "/data"
  REFLECTIONS_DAILY_CAP_USD = "5"
  REFLECTIONS_MONTHLY_CAP_USD = "25"
  REFLECTIONS_MAX_SESSIONS = "20"
  REFLECTIONS_CLIENT_IP_HEADER = "Fly-Client-IP"

[[mounts]]
  source = "npc_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
